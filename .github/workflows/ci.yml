name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: build + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then echo "::error::not gofmt-clean:"; echo "$drift"; exit 1; fi
      - name: build
        run: go build ./...
      # The panel driver is behind display_linux.go, so `go build ./...` on a
      # Mac never compiles it — which is how `constant 24576 overflows byte`
      # reached this repository. Build for the target, not only for the host;
      # arm64 is what the panel runs on.
      - name: build for linux
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -covermode=atomic -coverprofile=cover.out ./...
      - name: coverage
        run: go tool cover -func=cover.out | tail -1
